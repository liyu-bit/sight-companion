<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100E0A">
<title>看得见的同行者 · 购物助手</title>
<style>
  :root{
    --bg:#100E0A;
    --surface:#1C1812;
    --surface-2:#262017;
    --line:#75624A;
    --text:#FFF8EC;
    --muted:#CFC4AB;
    --amber:#FFB020;
    --amber-hi:#FFC94D;
    --amber-deep:#FF9E00;
    --red:#FF6B5A;
    --green:#3DDC84;
    --green-ink:#0F1A12;
    --blue:#5FB0FF;
    --accent:var(--amber);
    --accent-hi:var(--amber-hi);
    --accent-ink:#241A05;
  }
  body[data-theme="ok"]{ --accent:var(--green); --accent-hi:#7FE8AE; --accent-ink:var(--green-ink); }
  body[data-theme="info"]{ --accent:var(--blue); --accent-hi:#9CCBFF; --accent-ink:#081524; }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ height:100%; }
  body{
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    font-size:24px;
    line-height:1.45;
    overflow-x:hidden;
    overscroll-behavior-y:none;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  button, .advice-card, .camera-bar, .cam-overlay, .overlay, .help-sheet, input, textarea{
    touch-action:manipulation;
  }
  #helpMsg{
    -webkit-user-select:text;
    user-select:text;
    -webkit-touch-callout:default;
  }
  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-track{ background:var(--surface); }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; border:2px solid var(--surface); }
  ::-webkit-scrollbar-thumb:hover{ background:var(--amber); }
  html{ scrollbar-color:var(--line) var(--surface); scrollbar-width:thin; }

  .glow{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(60% 38% at 85% -6%, rgba(255,158,0,.16), transparent 70%),
      radial-gradient(52% 30% at 0% 22%, rgba(255,107,90,.07), transparent 70%),
      radial-gradient(70% 34% at 50% 108%, rgba(255,176,32,.13), transparent 72%);
    transition:opacity .6s;
  }
  body[data-theme="ok"] .glow{
    background:
      radial-gradient(60% 38% at 85% -6%, rgba(61,220,132,.14), transparent 70%),
      radial-gradient(70% 34% at 50% 108%, rgba(61,220,132,.12), transparent 72%);
  }
  body[data-theme="info"] .glow{
    background:
      radial-gradient(60% 38% at 85% -6%, rgba(95,176,255,.15), transparent 70%),
      radial-gradient(70% 34% at 50% 108%, rgba(95,176,255,.12), transparent 72%);
  }

  .app{
    position:relative; z-index:1;
    max-width:520px; margin:0 auto;
    padding:0 18px calc(140px + env(safe-area-inset-bottom));
  }

  /* ---------- 顶栏 ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:calc(6px + env(safe-area-inset-top)) 0 2px;
  }
  .brand{ font-size:20px; font-weight:600; color:var(--muted); letter-spacing:.06em; }
  .sound-btn{
    display:flex; align-items:center; gap:10px;
    min-height:60px; min-width:60px; padding:0 18px;
    background:var(--surface); color:var(--text);
    border:2px solid var(--line); border-radius:16px;
    font-size:20px; font-weight:700; font-family:inherit; cursor:pointer;
    transition:border-color .2s, background .2s, transform .1s;
  }
  .sound-btn:active{ transform:scale(.96); }
  .sound-btn[aria-pressed="true"]{ border-color:var(--amber); color:var(--amber-hi); }
  .sound-btn svg{ width:28px; height:28px; flex:none; }
  .sound-btn .icon-off{ display:none; }
  .sound-btn[aria-pressed="false"] .icon-on{ display:none; }
  .sound-btn[aria-pressed="false"] .icon-off{ display:block; }
  .sound-btn[aria-pressed="false"]{ color:var(--muted); }

  /* ---------- 语音状态条 ---------- */
  .mic-strip{
    display:flex; align-items:center; gap:10px;
    margin:2px 0; padding:6px 12px;
    background:var(--surface); border:2px solid var(--line); border-radius:14px;
    font-size:17px; font-weight:600; color:var(--muted);
    animation:rise .5s both;
  }
  .mic-dot{ flex:none; width:14px; height:14px; border-radius:50%; background:var(--muted); }
  .mic-strip[data-mic="listening"]{ border-color:rgba(61,220,132,.5); color:#A9F0C8; }
  .mic-strip[data-mic="listening"] .mic-dot{ background:var(--green); animation:micpulse 1.6s infinite; }
  .mic-strip[data-mic="speaking"]{ border-color:rgba(255,176,32,.5); color:var(--amber-hi); }
  .mic-strip[data-mic="speaking"] .mic-dot{ background:var(--amber); animation:micpulse 1s infinite; }
  .mic-bars{ display:none; align-items:flex-end; gap:3px; height:18px; margin-left:auto; }
  .mic-strip[data-mic="speaking"] .mic-bars{ display:flex; }
  .mic-bars i{ width:4px; border-radius:2px; background:var(--amber-hi); animation:bar 0.9s ease-in-out infinite; }
  .mic-bars i:nth-child(1){ height:8px; animation-delay:0s; }
  .mic-bars i:nth-child(2){ height:16px; animation-delay:.15s; }
  .mic-bars i:nth-child(3){ height:10px; animation-delay:.3s; }
  .mic-bars i:nth-child(4){ height:14px; animation-delay:.45s; }
  @keyframes bar{ 0%,100%{ transform:scaleY(.45); } 50%{ transform:scaleY(1); } }
  .mic-strip[data-mic="off"] .mic-dot{ background:var(--red); }
  @keyframes micpulse{
    0%{ box-shadow:0 0 0 0 rgba(61,220,132,.5); }
    70%{ box-shadow:0 0 0 10px rgba(61,220,132,0); }
    100%{ box-shadow:0 0 0 0 rgba(61,220,132,0); }
  }

  /* ---------- 风险 + 商品 ---------- */
  .risk-row{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin:4px 0 2px;
    animation:rise .5s .05s both;
  }
  .risk-pill{
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 16px; border-radius:999px;
    font-size:24px; font-weight:800;
    color:var(--accent-ink);
    background:linear-gradient(135deg,var(--accent-hi),var(--accent));
    box-shadow:0 4px 24px rgba(255,176,32,.35);
  }
  body[data-theme="ok"] .risk-pill{ box-shadow:0 4px 24px rgba(61,220,132,.3); }
  body[data-theme="info"] .risk-pill{ box-shadow:0 4px 24px rgba(95,176,255,.3); }
  .risk-pill svg{ width:26px; height:26px; }
  .product-name{ font-size:24px; font-weight:700; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 8px; animation:rise .5s .12s both; }
  .chips:empty{ display:none; }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 12px; border-radius:12px;
    background:var(--surface); border:2px solid var(--line);
    font-size:20px; font-weight:600; color:var(--text);
  }
  .chip.warn{ border-color:rgba(255,176,32,.55); color:var(--amber-hi); }
  .chip.hit{ border-color:rgba(255,107,90,.6); color:var(--red); }
  .chip svg{ width:24px; height:24px; flex:none; }

  .photo-strip{
    display:none; align-items:center; gap:14px;
    margin:0 0 12px; padding:8px 14px;
    background:var(--surface); border:2px solid var(--line); border-radius:16px;
    font-size:19px; color:var(--muted);
  }
  .photo-strip.show{ display:flex; animation:rise .4s both; }
  .photo-strip img{ width:56px; height:56px; object-fit:cover; border-radius:12px; border:2px solid var(--line); }

  /* ---------- 建议 + 理由（点按朗读） ---------- */
  .advice-card{
    width:100%; text-align:left; display:block;
    background:linear-gradient(160deg,var(--surface-2),var(--surface));
    border:2px solid var(--line);
    border-left:10px solid var(--accent);
    border-radius:22px;
    padding:14px 16px 12px;
    color:var(--text); font-family:inherit; cursor:pointer;
    transition:transform .12s, border-color .2s;
    animation:rise .5s .18s both;
  }
  .advice-card:active{ transform:scale(.985); }
  .advice-card.pulse{ animation:pulse .7s; }
  .block-label{
    display:flex; align-items:center; gap:8px;
    font-size:18px; font-weight:700; letter-spacing:.2em;
    color:var(--muted); margin-bottom:4px;
  }
  .block-label svg{ width:22px; height:22px; color:var(--accent); }
  .advice-text{
    font-size:clamp(36px,10.5vw,50px);
    font-weight:900; line-height:1.2;
    color:var(--accent-hi);
    text-shadow:0 2px 30px rgba(255,176,32,.25);
    margin-bottom:10px;
  }
  body[data-theme="ok"] .advice-text{ text-shadow:0 2px 30px rgba(61,220,132,.25); }
  body[data-theme="info"] .advice-text{ text-shadow:0 2px 30px rgba(95,176,255,.25); }
  .reason-text{ font-size:24px; font-weight:600; line-height:1.45; }
  .replay-hint{
    display:flex; align-items:center; gap:8px;
    margin-top:6px; font-size:16px; color:var(--muted);
  }
  .replay-hint svg{ width:20px; height:20px; }

  /* ---------- 播完后的音频控制 ---------- */
  .audio-row{ display:none; gap:10px; margin-top:10px; }
  .audio-row.show{ display:flex; animation:rise .35s both; }
  .audio-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:10px;
    min-height:64px; padding:8px 12px;
    background:var(--surface-2); color:var(--accent-hi);
    border:2px solid var(--accent); border-radius:18px;
    font-size:24px; font-weight:800; font-family:inherit; cursor:pointer;
    transition:background .2s, transform .12s, box-shadow .2s;
  }
  .audio-btn:hover{ background:#2E2619; box-shadow:0 4px 20px rgba(255,176,32,.2); }
  .audio-btn:active{ transform:scale(.97); }
  .audio-btn svg{ width:26px; height:26px; flex:none; }
  body[data-played="1"] .photo-strip{ display:none; }
  body[data-played="1"] .options-section{ margin-top:8px; }

  /* ---------- 求助家人入口（连续失败 2 次后出现） ---------- */
  .help-btn{
    display:none; align-items:center; justify-content:center; gap:14px;
    width:100%; min-height:76px; margin-top:10px; padding:10px 18px;
    background:linear-gradient(135deg,#FF9A8B,var(--red)); color:#2A0B08;
    border:none; border-radius:20px;
    font-size:28px; font-weight:900; font-family:inherit; cursor:pointer;
    box-shadow:0 8px 32px rgba(255,107,90,.35), inset 0 2px 0 rgba(255,255,255,.3);
    transition:transform .12s, box-shadow .2s;
  }
  .help-btn.show{ display:flex; animation:rise .35s both; }
  .help-btn:active{ transform:scale(.97); box-shadow:0 4px 18px rgba(255,107,90,.3); }
  .help-btn svg{ width:32px; height:32px; flex:none; }

  /* ---------- 求助面板 ---------- */
  .help-sheet{
    position:fixed; inset:0; z-index:30;
    display:none; align-items:center; justify-content:center; padding:20px;
    background:rgba(8,6,4,.9); backdrop-filter:blur(6px);
  }
  .help-sheet.show{ display:flex; }
  .help-panel{
    width:min(92vw,480px); max-height:calc(100vh - 40px); max-height:calc(100dvh - 40px); overflow:auto;
    background:var(--surface-2); border:2px solid var(--blue); border-radius:24px;
    padding:20px; display:flex; flex-direction:column; gap:14px;
    box-shadow:0 20px 80px rgba(95,176,255,.25); animation:rise .3s both;
  }
  .help-head{ display:flex; gap:14px; align-items:center; }
  .help-head img{
    width:88px; height:88px; object-fit:cover; flex:none;
    border-radius:16px; border:2px solid var(--line);
  }
  .help-panel h2{ font-size:26px; font-weight:900; color:#9CCBFF; }
  .help-sub{ font-size:17px; color:var(--muted); margin-top:4px; line-height:1.4; }
  #helpMsg{
    width:100%; min-height:120px; padding:12px;
    background:var(--surface); border:2px solid var(--line); border-radius:14px;
    color:var(--text); font-size:20px; line-height:1.5; font-family:inherit; resize:vertical;
  }
  .sheet-row{ display:flex; gap:10px; }
  .sheet-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    min-height:64px; padding:8px 12px;
    background:var(--surface); color:var(--text);
    border:2px solid var(--line); border-radius:16px;
    font-size:22px; font-weight:800; font-family:inherit; cursor:pointer;
    transition:transform .12s, background .2s;
  }
  .sheet-btn:active{ transform:scale(.97); }
  .sheet-btn.copy{ background:linear-gradient(135deg,#7FE8AE,var(--green)); border-color:var(--green); color:var(--green-ink); }
  .sheet-btn.share{ background:linear-gradient(135deg,#9CCBFF,var(--blue)); border-color:var(--blue); color:#081524; }
  .sheet-btn.close{ flex:none; width:100%; }
  .sheet-btn[hidden]{ display:none; }

  /* ---------- 选项 ---------- */
  .options-section{ margin-top:10px; animation:rise .5s .26s both; }
  .options-list{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .option-btn{
    display:flex; align-items:center; gap:14px;
    width:100%; min-height:76px; padding:10px 18px;
    background:var(--surface); color:var(--text);
    border:3px solid var(--line); border-radius:20px;
    font-size:28px; font-weight:800; line-height:1.3;
    font-family:inherit; text-align:left; cursor:pointer;
    transition:border-color .2s, background .2s, transform .12s, box-shadow .2s;
  }
  .option-btn:active{ transform:scale(.97); }
  .option-btn:hover{ border-color:var(--accent); }
  .option-num{
    flex:none; width:50px; height:50px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); border:2px solid var(--accent);
    color:var(--accent-hi); font-size:28px; font-weight:900;
    transition:background .2s, color .2s;
  }
  .option-check{ flex:none; width:36px; height:36px; margin-left:auto; display:none; }
  .option-btn[aria-pressed="true"]{
    background:linear-gradient(135deg,#7FE8AE,var(--green));
    border-color:var(--green); color:var(--green-ink);
    box-shadow:0 6px 28px rgba(61,220,132,.35);
  }
  .option-btn[aria-pressed="true"] .option-num{
    background:rgba(15,26,18,.15); border-color:var(--green-ink); color:var(--green-ink);
  }
  .option-btn[aria-pressed="true"] .option-check{ display:block; }

  /* ---------- 已选确认 ---------- */
  .confirm{
    display:none; align-items:flex-start; gap:14px;
    margin-top:16px; padding:16px 18px;
    background:rgba(61,220,132,.1);
    border:2px solid rgba(61,220,132,.55); border-radius:18px;
    font-size:24px; font-weight:700; color:#A9F0C8; line-height:1.45;
  }
  .confirm.show{ display:flex; animation:rise .35s both; }
  .confirm svg{ flex:none; width:32px; height:32px; color:var(--green); margin-top:2px; }
  .confirm .you-decide{ display:block; font-size:20px; font-weight:600; color:var(--muted); margin-top:4px; }

  /* ---------- 建议态：压缩次要信息，保证三块 + 选项同屏 ---------- */
  body[data-state="advice"] .mic-strip{ padding:6px 12px; }
  body[data-state="advice"] .chips{ gap:4px; margin:4px 0 6px; }
  body[data-state="advice"] .chip{ font-size:16px; padding:2px 8px; }
  body[data-state="advice"] .photo-strip{ padding:6px 12px; margin-bottom:8px; font-size:17px; }
  body[data-state="advice"] .photo-strip img{ width:40px; height:40px; }
  body[data-state="advice"] .advice-card{ padding:12px 16px 10px; }
  body[data-state="advice"] .advice-text{ margin-bottom:6px; }
  body[data-state="advice"] .replay-hint{ margin-top:6px; }
  body[data-state="advice"] .options-section{ margin-top:10px; }
  body[data-state="advice"] .options-list{ gap:10px; }
  body[data-state="advice"] .option-btn{ min-height:76px; padding:10px 16px; }
  body:not(.has-result) main{ display:none; }

  /* ---------- 信息不足态：再压缩，保证求助按钮 + 两选项同屏 ---------- */
  body[data-theme="info"] .mic-strip{ padding:4px 12px; }
  body[data-theme="info"] .chips{ margin:2px 0 4px; }
  body[data-theme="info"] .advice-text{ font-size:clamp(26px,7.6vw,32px); }
  body[data-theme="info"] .reason-text{ font-size:22px; }
  body[data-theme="info"] .replay-hint{ display:none; }
  body[data-theme="info"] .photo-strip{ display:none; }
  body[data-theme="info"] .option-num{ width:44px; height:44px; font-size:26px; }
  body[data-theme="info"] .help-btn{ min-height:72px; margin-top:8px; }
  body[data-theme="info"] .audio-row{ margin-top:8px; }
  body[data-theme="info"] .audio-btn{ min-height:60px; }
  body[data-theme="info"] .options-list{ gap:8px; }
  body[data-theme="info"] .option-btn{ min-height:70px; }
  body[data-state="advice"][data-theme="info"] .options-section{ margin-top:6px; }

  /* ---------- 底部拍照 ---------- */
  .camera-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    padding:14px 18px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 72%, transparent);
  }
  .camera-bar-inner{ max-width:520px; margin:0 auto; }
  .camera-btn{
    display:flex; align-items:center; justify-content:center; gap:16px;
    width:100%; min-height:96px;
    background:linear-gradient(135deg,var(--amber-hi),var(--amber-deep));
    color:#241A05; border:none; border-radius:26px;
    font-size:36px; font-weight:900; letter-spacing:.12em;
    font-family:inherit; cursor:pointer;
    box-shadow:0 10px 40px rgba(255,158,0,.4), inset 0 2px 0 rgba(255,255,255,.35);
    transition:transform .12s, box-shadow .2s;
  }
  .camera-btn:active{ transform:scale(.97); box-shadow:0 4px 20px rgba(255,158,0,.35); }
  .camera-btn svg{ width:46px; height:46px; }

  /* ---------- 相机取景 ---------- */
  .cam-overlay{
    position:fixed; inset:0; z-index:15;
    display:none; background:#000;
  }
  .cam-overlay.show{ display:block; }
  .cam-overlay video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .cam-scrim{
    position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to bottom, rgba(10,8,5,.72), transparent 26%, transparent 62%, rgba(10,8,5,.86));
  }
  .cam-cancel{
    position:absolute; top:calc(14px + env(safe-area-inset-top)); left:18px; z-index:2;
    min-height:60px; min-width:60px; padding:0 22px;
    background:rgba(16,14,10,.92); color:var(--text);
    border:2px solid var(--line); border-radius:16px;
    font-size:22px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .cam-cancel:active{ transform:scale(.96); }
  .cam-frame{
    position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
    width:min(78vw,340px); aspect-ratio:3/4; pointer-events:none;
  }
  .cam-frame i{
    position:absolute; width:44px; height:44px; border:5px solid var(--amber-hi);
    filter:drop-shadow(0 0 12px rgba(255,176,32,.6));
  }
  .cam-frame i:nth-child(1){ left:0; top:0; border-right:none; border-bottom:none; border-radius:14px 0 0 0; }
  .cam-frame i:nth-child(2){ right:0; top:0; border-left:none; border-bottom:none; border-radius:0 14px 0 0; }
  .cam-frame i:nth-child(3){ left:0; bottom:0; border-right:none; border-top:none; border-radius:0 0 0 14px; }
  .cam-frame i:nth-child(4){ right:0; bottom:0; border-left:none; border-top:none; border-radius:0 0 14px 0; }
  .cam-count{
    position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
    font-size:130px; font-weight:900; color:var(--amber-hi);
    text-shadow:0 0 50px rgba(255,176,32,.8), 0 4px 18px rgba(0,0,0,.7);
    pointer-events:none;
  }
  .cam-count.tick{ animation:countpop .9s; }
  @keyframes countpop{
    0%{ transform:translate(-50%,-50%) scale(1.35); opacity:.4; }
    30%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
  }
  .cam-hint{
    position:absolute; left:0; right:0; bottom:calc(140px + env(safe-area-inset-bottom));
    text-align:center; font-size:24px; font-weight:700; color:var(--text);
    text-shadow:0 2px 10px rgba(0,0,0,.9); padding:0 20px; pointer-events:none;
  }
  .cam-overlay .camera-bar{ background:linear-gradient(to top, rgba(10,8,5,.9) 72%, transparent); }

  /* ---------- 识别中遮罩 ---------- */
  .overlay{
    position:fixed; inset:0; z-index:20;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:26px;
    background:rgba(10,8,5,.92); backdrop-filter:blur(6px);
    text-align:center; padding:24px;
  }
  .overlay.show{ display:flex; }
  .overlay img{
    width:132px; height:132px; object-fit:cover; border-radius:22px;
    border:3px solid var(--amber); box-shadow:0 0 50px rgba(255,176,32,.35);
  }

    } else if(micMode === "listening"){
      strip.setAttribute("data-mic", "listening");
      txt.textContent = state === "advice"
        ? "在听 · 说序号选择，或再拍一次"
        : "在听 · 说「这个能买吗」自动拍照";
    } else if(micMode === "off"){
      strip.setAttribute("data-mic", "off");
      txt.textContent = "语音识别不可用 · 按下面大按钮拍照";
    } else {
      strip.setAttribute("data-mic", "starting");
      txt.textContent = "正在启动语音…";
    }
  }

  function micFail(msg){
    recFatal = true;
    micMode = "off";
    updateMicStrip();
    if(msg) speak(msg);
  }

  function initRecognition(){
    if(!SR){ micFail(); return; }
    rec = new SR();
    rec.lang = "zh-CN";
    rec.continuous = true;
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onstart = function(){ recRunning = true; recErrStreak = 0; micMode = "listening"; updateMicStrip(); };
    rec.onresult = function(ev){
      for(var i = ev.resultIndex; i < ev.results.length; i++){
        if(ev.results[i].isFinal){
          handleTranscript(ev.results[i][0].transcript);
        }
      }
    };
    rec.onerror = function(ev){
      recRunning = false;
      if(ev.error === "not-allowed" || ev.error === "service-not-allowed"){
        micFail("麦克风没开。没关系，按下面的大按钮也能拍照。");
      } else if(ev.error === "network"){
        recErrStreak++;
        if(recErrStreak >= 2) micFail("语音识别连不上。按下面的大按钮拍照就行。");
      } else if(ev.error !== "no-speech" && ev.error !== "aborted"){
        recErrStreak++;
        if(recErrStreak >= 4) micFail();
      }
    };
    rec.onend = function(){
      recRunning = false;
      if(!recFatal && !speaking && (state === "idle" || state === "advice")){
        clearTimeout(recRestartTimer);
        recRestartTimer = setTimeout(maybeListen, 500);
      }
    };
    maybeListen();
  }
  function maybeListen(){
    if(recFatal || !rec || recRunning || speaking) return;
    if(state !== "idle" && state !== "advice") return;
    try{ rec.start(); }catch(e){}
  }
  function stopListening(){
    clearTimeout(recRestartTimer);
    if(rec && recRunning){ try{ rec.stop(); }catch(e){} }
  }

  /* ---------- 口令解析 ---------- */
  function handleTranscript(raw){
    var t = String(raw).replace(/[\s，。？！、,.?!]/g, "");
    if(!t) return;
    if(state === "capturing" || state === "checking") return;
    if(helpOpen){ if(/关闭|关掉/.test(t)) closeHelp(); return; }
    if(/再拍|重拍|重新拍|再照/.test(t)){ startCapture(); return; }
    if(state === "advice"){
      if(failStreak >= 2 && /求助|找家人|叫家人|帮我看/.test(t)){ openHelp(); return; }
      var cn = ["一","二","三","四"];
      for(var i=0;i<data.options.length && i<4;i++){
        var ord = new RegExp("^(选|要|就)?(第)?" + cn[i] + "(个)?$|^(选|要)" + (i+1) + "$");
        var kw = data.options[i].slice(0,2);
        if(ord.test(t) || t.indexOf(kw) !== -1){ choose(i); return; }
      }
    }
    if(/能喝|能买|这是什么|能不能喝|能不能买|拍一下|拍照/.test(t)){ startCapture(); }
  }

  /* ================= 相机（getUserMedia 后置） ================= */
  function setState(s){
    state = s;
    document.body.setAttribute("data-state", s);
    if(s === "capturing" || s === "checking") stopListening();
    else maybeListen();
    updateMicStrip();
    updateAudioRow();
  }

  function startCapture(){
    if(state === "capturing"){ captureNow(); return; }
    if(state === "checking") return;
    clearTimeout(failTimer);
    $("overlay").classList.remove("show");
    buzz(20);
    setState("capturing");
    $("camOverlay").classList.add("show");
    $("camCount").textContent = "";
    $("camHint").textContent = "正在打开相机…";
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      cameraFallback("这个浏览器打不开相机，帮你打开系统相机。");
      return;
    }
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false
    }).then(function(s){
      if(state !== "capturing"){ s.getTracks().forEach(function(tr){ tr.stop(); }); return; }
      stream = s;
      var v = $("camVideo");
      v.srcObject = s;
      var p = v.play(); if(p && p.catch) p.catch(function(){});
      $("camHint").textContent = "把商品放进框里，马上自动拍照";
      speakSeq(["正在拍照。请把商品对准手机背面，三秒后自动拍照。"]);
      startCountdown();
    }).catch(function(){
      cameraFallback("相机打不开，帮你打开系统相机。");
    });
  }

  function cameraFallback(msg){
    closeCamera(true);
    setState("idle");
    speak(msg);
    $("cameraInput").click();
  }

  function startCountdown(){
    clearInterval(countdownTimer);
    countdownVal = 3;
    showCount();
    countdownTimer = setInterval(function(){
      countdownVal--;
      if(countdownVal <= 0){ captureNow(); }
      else showCount();
    }, 1000);
  }
  function showCount(){
    var el = $("camCount");
    el.textContent = String(countdownVal);
    el.classList.remove("tick");
    void el.offsetWidth;
    el.classList.add("tick");
    tickBeep();
    buzz(8);
  }

  function captureNow(){
    if(state !== "capturing") return;
    clearInterval(countdownTimer); countdownTimer = null;
    var v = $("camVideo");
    var url = null;
    if(stream && v.videoWidth){
      var c = document.createElement("canvas");
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext("2d").drawImage(v, 0, 0);
      url = c.toDataURL("image/jpeg", 0.9);
    }
    shutter();
    buzz(25);
    closeCamera(true);
    if(url){ showChecking(url); }
    else cameraFallback("没取到画面，帮你打开系统相机。");
  }

  function closeCamera(silent){
    clearInterval(countdownTimer); countdownTimer = null;
    if(stream){ stream.getTracks().forEach(function(tr){ tr.stop(); }); stream = null; }
    $("camVideo").srcObject = null;
    $("camOverlay").classList.remove("show");
    if(!silent) setState("idle");
  }

  guarded($("camCancel"), function(){
    closeCamera(false);
    buzz(15);
    speak("已取消。想拍的时候，说这个能买吗，或者按大按钮。");
  });
  guarded($("camShoot"), function(){ captureNow(); });

  /* ================= 核对 → 建议 / 失败重试 ================= */
  /* 清晰度启发式：缩样灰度图的拉普拉斯方差，模糊/纯色画面得分极低 */
  function blurScore(url){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){
        try{
          var nw = img.naturalWidth || img.width, nh = img.naturalHeight || img.height;
          if(!nw || !nh){ resolve(0); return; }
          var w = Math.min(320, nw);
          var h = Math.max(1, Math.round(w * nh / nw));
          var c = document.createElement("canvas");
          c.width = w; c.height = h;
          var g = c.getContext("2d", { willReadFrequently: true });
          g.drawImage(img, 0, 0, w, h);
          var px = g.getImageData(0, 0, w, h).data;
          var gray = new Float32Array(w * h);
          for(var i = 0; i < w * h; i++){
            gray[i] = 0.299 * px[i*4] + 0.587 * px[i*4+1] + 0.114 * px[i*4+2];
          }
          var sum = 0, sum2 = 0, n = 0;
          for(var y = 1; y < h - 1; y++){
            for(var x = 1; x < w - 1; x++){
              var k = y * w + x;
              var l = 4 * gray[k] - gray[k-1] - gray[k+1] - gray[k-w] - gray[k+w];
              sum += l; sum2 += l * l; n++;
            }
          }
          if(!n){ resolve(0); return; }
          var mean = sum / n;
          resolve(Math.max(0, sum2 / n - mean * mean));
        }catch(e){ resolve(0); }
      };
      img.onerror = function(){ resolve(0); };
      img.src = url;
    });
  }

  function showChecking(url){
    closeCamera(true);
    setState("checking");
    lastPhotoUrl = url;
    $("overlayThumb").src = url;
    $("overlay").setAttribute("data-fail", "0");
    $("overlayText").textContent = "正在核对…";
    $("overlaySub").textContent = "";
    $("overlay").classList.add("show");
    speak("正在核对，请稍等。");
    clearTimeout(checkTimer);
    var token = ++checkToken;
    blurScore(url).then(function(score){
      if(token !== checkToken) return;
      if(score < BLUR_THRESHOLD){
        checkTimer = setTimeout(function(){ deliverFail(url); }, 1200);
        return;
      }
      advise(url, token);
    });
  }

  /* 契约 §1：POST /api/advise，image 为纯 base64（不带 data: 前缀），B-1 侧不再 strip */
  function advise(url, token){
    /* file:// 下相对路径无法请求；仅当 API_URL 被显式配成绝对 http(s) 地址时才尝试外呼 */
    var absoluteApi = /^https?:\/\//i.test(API_URL);
    if(!absoluteApi && !/^https?:$/.test(location.protocol)){ demoResult(url, token); return; }
    var t0 = Date.now();
    var reqBody = JSON.stringify({ image: url.slice(url.indexOf(",") + 1), user: USER_PROFILE });
    var ctrl = ("AbortController" in window) ? new AbortController() : null;
    var abortTimer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, API_TIMEOUT);
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: reqBody,
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(r){
      if(!r.ok){ var e = new Error("http " + r.status); e.http = r.status; throw e; }
      return r.json();
    }).then(function(p){
      clearTimeout(abortTimer);
      if(token !== checkToken) return;
      if(!p || typeof p.advice !== "string" || !Array.isArray(p.options) || typeof p.speech !== "string"){
        var e = new Error("bad contract"); e.http = 400; throw e;
      }
      if(p.user_decides !== true) p.user_decides = true;  // 契约 §2 红线：决策权恒归使用者
      backendOnline = true;
      applyResult(p, url);
    }).catch(function(err){
      clearTimeout(abortTimer);
      if(token !== checkToken) return;
      if(err && err.http){ deliverFail(url); return; }  // 后端可达但报错 → 按「没看清」重试
      backendOnline = false;
      demoResult(url, token, Math.max(0, 1200 - (Date.now() - t0)));
    });
  }

  /* 断网 / 超时 / 非 JSON：绝不播「有风险」假建议——视障用户看不见界面小标签，
     误信假结论有安全风险。改走「信息不足 + 建议求助家人」，并在语音里明说是演示数据。 */
  var OFFLINE_DEMO = {
    offline_demo: true,
    product: "",
    expiry_days: null,
    allergen_hit: null,
    price: null,
    advice: "建议让家人帮你看一眼",
    reason: "没连上后端，这是离线演示内容，不是对你眼前商品的判断",
    options: ["拍照发给家人", "再拍一次"],
    user_decides: true,
    status: "info",
    help_required: true,
    speech: "现在没连上后端，我给不了真实建议。哪怕屏幕上出现内容，那也只是演示数据，别当真。建议让家人帮你看一眼，你自己定。"
  };
  function demoResult(url, token, delay){
    checkTimer = setTimeout(function(){
      if(token !== checkToken) return;
      showInfoAdvice(url, OFFLINE_DEMO, { skipStreakChip: true, photoState: "已拍摄 · 未连后端" });
      $("chips").appendChild(chip("离线演示 · 未连后端", "warn"));
    }, delay === undefined ? 1200 : delay);
  }

  function applyResult(p, url){
    if(themeOf(p) === "info"){
      failStreak++;
      showInfoAdvice(url, p);
    } else {
      showAdvice(url, p);
    }
  }

  function deliverFail(url){
    failStreak++;
    $("overlay").setAttribute("data-fail", "1");
    $("overlayText").textContent = "没看清…";
    $("overlaySub").textContent = failStreak === 1 ? "马上自动再拍一次" : "两次没看清，帮你打开求助";
    buzz([60, 40, 60]);
    failTone();
    speak("没看清，再来一次。");
    clearTimeout(failTimer);
    if(failStreak === 1){
      setState("idle");
      failTimer = setTimeout(function(){ startCapture(); }, 1700);
    } else {
      failTimer = setTimeout(function(){ showInfoAdvice(url); }, 1700);
    }
  }

  function showAdvice(url, payload){
    clearTimeout(failTimer);
    failStreak = 0;
    /* 契约 §3.5 致命过敏轨：后端带 help_required 时首次即出求助按钮（字段待三人写进契约，前端先兼容） */
    var forceHelp = !!(payload && payload.help_required === true);
    $("helpBtn").classList.toggle("show", forceHelp);
    $("overlay").classList.remove("show");
    if(url){
      $("photoThumb").src = url;
      $("photoState").textContent = "已拍摄 · 识别完成";
      $("photoStrip").classList.add("show");
    }
    render(payload || embedded["有风险"]);
    setState("advice");
    var card = $("adviceCard");
    card.classList.remove("pulse");
    void card.offsetWidth;
    card.classList.add("pulse");
    buzz([30, 40, 30]);
    chime();
    speechTail = forceHelp ? HELP_LINE : "";
    playAdviceSpeech();
  }

  function showInfoAdvice(url, payload, opts){
    opts = opts || {};
    clearTimeout(failTimer);
    $("overlay").classList.remove("show");
    if(url){
      $("photoThumb").src = url;
      $("photoState").textContent = opts.photoState || "已拍摄 · 没看清";
      $("photoStrip").classList.add("show");
    }
    render(payload || embedded["信息不足"]);
    if(!opts.skipStreakChip) $("chips").appendChild(chip("连续 " + failStreak + " 次没看清", "hit"));
    var forceHelp = (failStreak >= 2) || !!(payload && payload.help_required === true);
    $("helpBtn").classList.toggle("show", forceHelp);
    setState("advice");
    var card = $("adviceCard");
    card.classList.remove("pulse");
    void card.offsetWidth;
    card.classList.add("pulse");
    buzz([40, 60, 40]);
    speechTail = forceHelp ? HELP_LINE : "";
    playAdviceSpeech();
  }

  /* ================= 求助家人 ================= */
  function helpMessage(){
    return "【购物助手·求助】我在看「" + (data.product || "一件商品") + "」，" +
      (data.reason || "没看清") + "。请帮我看一眼保质期和配料，告诉我你的建议。买不买我自己决定。";
  }
  function openHelp(){
    $("helpMsg").value = helpMessage();
    if(lastPhotoUrl) $("helpPhoto").src = lastPhotoUrl;
    $("copyBtn").textContent = "复制消息";
    $("shareBtn").hidden = !navigator.share;
    $("helpSheet").classList.add("show");
    var ta = $("helpMsg");
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight + 4, 260) + "px";
    helpOpen = true;
    buzz(20);
    speakSeq(["求助消息准备好了。点复制消息发给家人，或者点系统分享。"]);
  }
  function closeHelp(){
    $("helpSheet").classList.remove("show");
    helpOpen = false;
    speak("求助已关闭。");
  }
  function legacyCopy(done){
    var ta = $("helpMsg");
    ta.focus(); ta.select();
    var ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){}
    done(ok);
  }
  function copyHelpMsg(btn){
    var msg = $("helpMsg").value;
    function done(ok){
      if(ok){
        btn.textContent = "已复制";
        buzz(20); chime();
        speak("已复制，发给家人吧。");
      } else {
        $("helpMsg").focus(); $("helpMsg").select();
        speak("请长按文字，选择复制。");
      }
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(msg).then(function(){ done(true); }, function(){ legacyCopy(done); });
    } else legacyCopy(done);
  }
  guarded($("helpBtn"), function(){ openHelp(); });
  guarded($("copyBtn"), function(){ copyHelpMsg(this); });
  guarded($("closeHelpBtn"), function(){ buzz(15); closeHelp(); });
  guarded($("shareBtn"), function(){
    buzz(20);
    var msg = $("helpMsg").value;
    function textShare(){
      navigator.share({ title: "购物助手求助", text: msg }).catch(function(e){
        if(e && e.name !== "AbortError") copyHelpMsg($("copyBtn"));
      });
    }
    if(lastPhotoUrl && window.File && navigator.canShare){
      fetch(lastPhotoUrl).then(function(r){ return r.blob(); }).then(function(b){
        var f = new File([b], "shopping-help.jpg", { type: b.type || "image/jpeg" });
        if(navigator.canShare({ files: [f] })){
          return navigator.share({ files: [f], title: "购物助手求助", text: msg });
        }
        return navigator.share({ title: "购物助手求助", text: msg });
      }).catch(function(e){
        if(e && e.name !== "AbortError") textShare();
      });
    } else textShare();
  });

  guarded($("replayBtn"), function(){
    buzz(15);
    playAdviceSpeech();
  });
  guarded($("listenOptsBtn"), function(){
    buzz(15);
    var parts = data.options.map(function(opt, i){
      return "选项" + ["一","二","三","四"][i] + "，" + opt + "。";
    });
    parts.push("说第一个或第二个来选。最终你决定。");

  });

  /* ---------- 系统相机兜底（file input） ---------- */
  /* 手机原图动辄 5–10MB，后端上限约 4.5MB（agents/orchestrate.py），413 会被误判「没看清」。
     先经 canvas 压到最长边 1280px、JPEG 0.85 再提交；解码失败才退回原图。 */
  $("cameraInput").addEventListener("change", function(){
    var file = this.files && this.files[0];
    this.value = "";
    if(!file) return;
    var raw = function(){
      var reader = new FileReader();
      reader.onload = function(){ shutter(); buzz(25); showChecking(reader.result); };
      reader.onerror = function(){ speak("照片没读成功，请再拍一次。"); };
      reader.readAsDataURL(file);
    };
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      URL.revokeObjectURL(url);
      try{
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if(!w || !h){ raw(); return; }
        var scale = Math.min(1, 1280 / Math.max(w, h));
        var cw = Math.round(w * scale), chh = Math.round(h * scale);
        var cv = document.createElement("canvas");
        cv.width = cw; cv.height = chh;
        cv.getContext("2d").drawImage(img, 0, 0, cw, chh);
        var out = cv.toDataURL("image/jpeg", 0.85);
        if(!/^data:image\/jpeg/.test(out)){ raw(); return; }
        shutter();
        buzz(25);
        showChecking(out);
      }catch(e){ raw(); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); raw(); };
    img.src = url;
  });

  /* ---------- 主按钮：任何状态下都是「拍照」，语音失败时的兜底 ---------- */
  guarded($("cameraBtn"), function(){
    if(state === "checking") return;
    startCapture();
  });

  /* ================= 渲染 ================= */
  function themeOf(d){
    /* 显式 status 优先（契约变更提案字段，待三人确认）；未提供时退回 §3 话术关键词启发式 */
    if(d.status === "risk" || d.status === "ok" || d.status === "info") return d.status;
    if(d.advice.indexOf("家人") !== -1) return "info";   // §3 信息不足话术固定含「家人帮你看一眼」
    if(d.allergen_hit || (d.expiry_days !== null && d.expiry_days !== undefined && d.expiry_days <= 7)) return "risk";
    return "ok";
  }
  function chip(html, cls){
    var el = document.createElement("span");
    el.className = "chip" + (cls ? " " + cls : "");
    el.innerHTML = html;
    return el;
  }
  function render(d){
    data = d;
    selected = -1;
    var theme = themeOf(d);
    document.body.setAttribute("data-theme", theme);
    $("riskText").textContent = theme === "risk" ? "有风险" : (theme === "info" ? "没看清" : "没看到风险");
    $("productName").textContent = d.product || "";
    $("adviceText").textContent = d.advice;
    $("reasonText").textContent = d.reason;

    var chips = $("chips");
    chips.textContent = "";
    if(d.price !== null && d.price !== undefined) chips.appendChild(chip("价格 ¥" + d.price));
    if(d.expiry_days !== null && d.expiry_days !== undefined) chips.appendChild(chip("保质期剩 " + d.expiry_days + " 天", d.expiry_days <= 7 ? "warn" : ""));
    if(d.allergen_hit) chips.appendChild(chip("过敏原 · " + d.allergen_hit, "hit"));

    var list = $("optionsList");
    list.textContent = "";
    d.options.forEach(function(opt, i){
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.type = "button";
      btn.setAttribute("aria-pressed", "false");
      var num = document.createElement("span");
      num.className = "option-num";
      num.setAttribute("aria-hidden", "true");
      num.textContent = String(i + 1);
      var label = document.createElement("span");
      label.textContent = opt;
      var check = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      check.setAttribute("class", "option-check");
      check.setAttribute("viewBox", "0 0 24 24");
      check.setAttribute("fill", "none");
      check.setAttribute("stroke", "currentColor");
      check.setAttribute("stroke-width", "3");
      check.setAttribute("stroke-linecap", "round");
      check.setAttribute("stroke-linejoin", "round");
      check.setAttribute("aria-hidden", "true");
      var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", "m4.5 12.5 5 5 10-11");
      check.appendChild(p);
      btn.appendChild(num); btn.appendChild(label); btn.appendChild(check);
      guarded(btn, function(){ choose(i); });
      list.appendChild(btn);
    });
    $("confirmBox").classList.remove("show");
    $("confirmText").textContent = "";
    document.body.classList.add("has-result");
  }

  function choose(i){
    var opt = data.options[i];
    if(/再拍|重拍/.test(opt)){ buzz(15); startCapture(); return; }
    selected = i;
    var btns = $("optionsList").children;
    for(var k=0;k<btns.length;k++) btns[k].setAttribute("aria-pressed", String(k === i));
    $("confirmText").textContent = "已选择：" + opt;
    $("confirmBox").classList.add("show");
    var cr = $("confirmBox").getBoundingClientRect();
    var limit = $("cameraBtn").getBoundingClientRect().top - 10;
    if(cr.bottom > limit){
      window.scrollBy({ top: cr.bottom - limit, behavior: "smooth" });
    }
    if(/家人/.test(opt)){ buzz(30); openHelp(); return; }
    buzz(30);
    chime();
    speakSeq(["选项" + ["一","二","三","四"][i] + "，" + opt + "。", "已选择。最终由你决定。"]);
  }

  guarded($("adviceCard"), function(){
    buzz(15);
    playAdviceSpeech();
  });

  /* ================= 启动 ================= */
  /* 首屏不显示任何建议（避免「还没拍就有结论」的放录像观感），结果区在首次识别完成后出现 */
  function boot(){
    setState("idle");
    initRecognition();
    keepAwake();
    speakSeq(["我是你的购物助手。", "把商品对准手机背面，说：这个能买吗。也可以按下面的大按钮拍照。"]);
  }
  boot();

  /* 联调/测试钩子（B-1 对接时可直接驱动状态机） */
  window.__assistant = {
    state: function(){ return state; },
    handleTranscript: handleTranscript,
    startCapture: startCapture,
    spokenLog: function(){ return spokenLog.slice(); },
    micMode: function(){ return micMode; },
    playback: function(){
      return { played: advicePlayed, speaking: speaking, rowShown: $("audioRow").classList.contains("show"), viaAudio: !!audioEl };
    },
    applyBackend: function(payload){ applyResult(payload, lastPhotoUrl); },
    submitImage: function(url){ showChecking(url); },
    failStreak: function(){ return failStreak; },
    blurScore: blurScore,
    helpShown: function(){ return $("helpBtn").classList.contains("show"); },
    helpOpen: function(){ return helpOpen; },
    api: function(){ return { url: API_URL, timeout: API_TIMEOUT, online: backendOnline }; }
  };
})();
</script>
</body>
</html>
